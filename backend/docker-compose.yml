services:
  db:
    image: postgres:16-alpine
    container_name: techmind-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techmind}
      POSTGRES_USER: ${POSTGRES_USER:-techmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techmind}
    ports:
      - "5432:5432"
    volumes:
      - techmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techmind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: techmind-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-techmind}
      DB_USERNAME: ${POSTGRES_USER:-techmind}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-techmind}
      TECHMIND_ML_FALLBACK_ENABLED: ${TECHMIND_ML_FALLBACK_ENABLED:-true}
      TECHMIND_OCI_LANGUAGE_ENABLED: ${TECHMIND_OCI_LANGUAGE_ENABLED:-false}
      TECHMIND_OCI_COMPARTMENT_ID: ${TECHMIND_OCI_COMPARTMENT_ID:-}
      TECHMIND_OCI_CONFIG_FILE: ${TECHMIND_OCI_CONFIG_FILE:-~/.oci/config}
      TECHMIND_OCI_PROFILE: ${TECHMIND_OCI_PROFILE:-DEFAULT}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  techmind_pgdata:
