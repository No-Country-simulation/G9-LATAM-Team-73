services:
  api:
    build: .
    container_name: techmind-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TECHMIND_ML_FALLBACK_ENABLED: ${TECHMIND_ML_FALLBACK_ENABLED:-true}
      TECHMIND_OCI_LANGUAGE_ENABLED: ${TECHMIND_OCI_LANGUAGE_ENABLED:-false}
      TECHMIND_OCI_COMPARTMENT_ID: ${TECHMIND_OCI_COMPARTMENT_ID:-}
      TECHMIND_OCI_CONFIG_FILE: ${TECHMIND_OCI_CONFIG_FILE:-~/.oci/config}
      TECHMIND_OCI_PROFILE: ${TECHMIND_OCI_PROFILE:-DEFAULT}
      TECHMIND_CORS_ALLOWED_ORIGINS: ${TECHMIND_CORS_ALLOWED_ORIGINS:-http://localhost:4321}
    ports:
      - "${SERVER_PORT:-8080}:8080"
