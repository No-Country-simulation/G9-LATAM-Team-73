spring.application.name=techmind-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/techmind
spring.datasource.username=techmind
spring.datasource.password=techmind
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- ML / ONNX (Dev 2) ---
techmind.ml.category-model-path=model/modelo_categoria.onnx
techmind.ml.category-map-path=model/mapa_categoria.json
techmind.ml.language-model-path=model/modelo_lenguaje.onnx
techmind.ml.language-map-path=model/mapa_lenguaje.json
techmind.ml.fallback-enabled=true

# --- OCI Language translation EN -> ES (Dev 2) ---
# Enable when OCI credentials are available (ConfigFileAuthenticationDetailsProvider ~/.oci/config)
techmind.oci.language.enabled=false
techmind.oci.language.compartment-id=
techmind.oci.language.config-file=~/.oci/config
techmind.oci.language.profile=DEFAULT

# --- CORS (frontend) ---
techmind.cors.allowed-origins=http://localhost:4321
